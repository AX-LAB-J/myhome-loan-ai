[project]
name = "housing-loan-side"
version = "0.1.0"
description = "Synthetic housing and loan explorer with a grounded Deep Agent"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["side", ".venv", "data", "models"]

[tool.ruff.lint]
select = ["E9", "F401", "F63", "F7", "F82", "F841"]
